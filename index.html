<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10101a"><title>Mijn Budget</title><style>
:root{color-scheme:dark;--bg:#0e0d17;--panel:#1a1928;--panel2:#242138;--line:#343048;--text:#f6f4fc;--muted:#aaa6bd;--purple:#9d65f8;--green:#68d9a2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#35224e,#0e0d17 55%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}main{max-width:500px;margin:auto;min-height:100dvh;padding:24px 18px 105px}.top{display:flex;justify-content:space-between;align-items:center;margin:5px 0 23px}.brand{font-size:22px;font-weight:800}.brand b{color:#b68bff}.tag{font-size:12px;color:var(--muted)}h1{font-size:28px;margin:0 0 6px}h2{font-size:16px;margin:24px 0 12px}.hint{color:var(--muted);margin:0 0 19px;font-size:13px}.month{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:5px;border-radius:15px;background:#1c1a29}.month button{border:0;background:#2b2740;color:white;border-radius:10px;width:35px;height:35px}.month strong{font-size:13px;min-width:95px;text-align:center}.card{background:linear-gradient(155deg,#242036,#191725);border:1px solid var(--line);padding:17px;border-radius:17px;margin-bottom:11px}.total{background:linear-gradient(120deg,#372456,#241b39);border-color:#7447bb}.kicker{color:#cbc3db;font-size:13px}.big{font-size:34px;letter-spacing:-1px;font-weight:800;margin:5px 0}.violet{color:#be96ff}.green{color:var(--green)}.numbers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.numbers .card{padding:15px}.number{font-size:22px;font-weight:750;margin-top:8px}.bar{height:8px;border-radius:20px;background:#4b3b60;margin-top:14px;overflow:hidden}.bar>div{height:100%;background:#b277ff;border-radius:20px}.line{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 12px;margin:8px 0}.meta{font-size:12px;color:var(--muted);margin-top:4px}.amount{font-weight:800;white-space:nowrap}.edit{border:0;border-radius:9px;background:#39304f;color:#d4b7ff;padding:8px 10px}.add{width:100%;border:1px dashed #8159b4;background:#261e37;color:#d9c2ff;border-radius:14px;padding:13px;margin-top:10px;font-weight:750}.primary{background:linear-gradient(90deg,#8750ed,#aa6df7);color:white;border:0;border-radius:12px;padding:13px 20px;font-weight:750}.nav{position:fixed;bottom:0;left:0;right:0;background:#15131fee;border-top:1px solid var(--line);display:flex;justify-content:center;padding:9px 6px max(12px,env(safe-area-inset-bottom));backdrop-filter:blur(14px)}.navinner{display:flex;width:min(100%,500px);justify-content:space-around}.nav button{border:0;background:none;color:#aaa5ba;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;padding:5px 8px}.nav button.active{color:#bf93ff}.emoji{font-size:20px}.hidden{display:none!important}.sheet{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:3}.dialog{width:min(100%,500px);border:1px solid var(--line);border-radius:20px 20px 0 0;background:#211c30;padding:22px 20px 28px}.dialog h2{font-size:22px;margin:0 0 20px}.field{display:block;margin:14px 0;color:#d4cde2;font-size:13px}.field input,.field select{display:block;width:100%;background:#13111e;color:#fff;border:1px solid #514768;border-radius:10px;padding:12px;margin-top:7px;outline:none}.buttons{display:flex;gap:10px;margin-top:20px}.buttons button{flex:1}.cancel{border:1px solid var(--line);border-radius:12px;background:transparent;color:#fff;padding:12px}.danger{border:0;background:transparent;color:#ff999f;padding:10px;margin-top:8px}.note{font-size:12px;color:#aaa6bd;line-height:1.55;padding:12px 0} .empty{color:var(--muted);font-size:13px} @media(min-width:700px){main{margin-top:20px;min-height:calc(100dvh - 20px)}}
</style></head><body><main><header class="top"><div class="brand">◈ Mijn <b>Budget</b></div><div class="month"><button id="prev" aria-label="Vorige maand">‹</button><strong id="monthLabel"></strong><button id="next" aria-label="Volgende maand">›</button></div></header><div id="view"></div></main><nav class="nav"><div class="navinner"><button data-tab="overview" class="active"><span class="emoji">⌂</span>Overzicht</button><button data-tab="income"><span class="emoji">▣</span>Inkomsten</button><button data-tab="bills"><span class="emoji">▤</span>Vaste lasten</button><button data-tab="expenses"><span class="emoji">◷</span>Uitgaven</button></div></nav><div class="sheet hidden" id="sheet" role="dialog" aria-modal="true"><form class="dialog" id="form"><h2 id="formTitle">Toevoegen</h2><label class="field">Omschrijving<input id="name" maxlength="70" required placeholder="Bijv. salaris of huur"></label><label class="field">Bedrag (€)<input id="amount" type="number" required min="0" max="100000000" step="0.01" inputmode="decimal" placeholder="0,00"></label><label class="field" id="dateField">Datum<input type="date" id="date"></label><label class="field" id="repeatField">Herhaling<select id="repeat"><option value="monthly">Iedere maand</option><option value="once">Alleen deze maand</option></select></label><div class="buttons"><button type="button" class="cancel" id="close">Annuleren</button><button class="primary" type="submit">Opslaan</button></div><button type="button" class="danger hidden" id="delete">Verwijderen</button></form></div><script>
const $=id=>document.getElementById(id), euro=n=>new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'}).format(n), safe=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
const storageKey='mijn-budget-v1';let data;try{data=JSON.parse(localStorage.getItem(storageKey))||{items:[]}}catch{data={items:[]}};if(!Array.isArray(data.items))data={items:[]};let cursor=new Date(),tab='overview',editing=null,kind=null;cursor.setDate(1);const key=()=>`${cursor.getFullYear()}-${String(cursor.getMonth()+1).padStart(2,'0')}`,today=()=>new Date().toISOString().slice(0,10),save=()=>localStorage.setItem(storageKey,JSON.stringify(data));
// Each recurring bill/income begins on its creation month and can be overridden for one month.
function active(item,k){if(item.deletedFrom&&k>=item.deletedFrom)return false;if(item.repeat==='once')return item.month===k;return k>=item.month}
function amountFor(item,k){return Object.hasOwn(item.overrides||{},k)?item.overrides[k]:item.amount}
function items(type){return data.items.filter(i=>i.type===type&&active(i,key())).map(i=>({...i,shownAmount:amountFor(i,key())}));}
function sum(type){return items(type).reduce((v,i)=>v+Number(i.shownAmount),0)}
function line(i){return `<div class="line"><div><strong>${safe(i.name)}</strong><div class="meta">${i.repeat==='monthly'?'Maandelijks':'Eenmalig'}${i.date?' · '+safe(i.date):''}</div></div><div style="display:flex;align-items:center;gap:9px"><span class="amount">${euro(i.shownAmount)}</span><button class="edit" data-edit="${safe(i.id)}" aria-label="Bewerk ${safe(i.name)}">✎</button></div></div>`}
function render(){const inc=sum('income'),bills=sum('bills'),expenses=sum('expenses'),left=inc-bills-expenses; $('monthLabel').textContent=cursor.toLocaleDateString('nl-NL',{month:'short',year:'numeric'});document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let s='';if(tab==='overview'){s=`<h1>Overzicht</h1><p class="hint">Je geldzaken voor ${cursor.toLocaleDateString('nl-NL',{month:'long',year:'numeric'})}</p><div class="card total"><div class="kicker">Nog beschikbaar deze maand</div><div class="big ${left>=0?'violet':''}">${euro(left)}</div><div class="meta">Na vaste lasten en uitgaven</div><div class="bar"><div style="width:${inc>0?Math.min(100,Math.max(0,(bills+expenses)/inc*100)):0}%"></div></div></div><div class="numbers"><div class="card"><div class="kicker">Inkomsten</div><div class="number green">${euro(inc)}</div></div><div class="card"><div class="kicker">Vaste lasten</div><div class="number">${euro(bills)}</div></div></div><div class="card"><div class="kicker">Overige uitgaven</div><div class="number">${euro(expenses)}</div></div><h2>Snel toevoegen</h2><div class="buttons"><button class="primary" data-add="income">+ Inkomsten</button><button class="primary" data-add="expenses">+ Uitgave</button></div>`}else{const names={income:['Inkomsten','Pas je salaris en andere inkomsten per maand aan.','Inkomst'],bills:['Vaste lasten','Wijzig je vaste kosten wanneer ze veranderen.','Vaste last'],expenses:['Uitgaven','Houd bij waar je geld naartoe gaat.','Uitgave']};const [heading,help,singular]=names[tab];s=`<h1>${heading}</h1><p class="hint">${help}</p><div class="card total"><div class="kicker">Totaal deze maand</div><div class="big violet">${euro(sum(tab))}</div></div>${items(tab).map(line).join('')||'<p class="empty">Nog niets toegevoegd voor deze maand.</p>'}<button class="add" data-add="${tab}">＋ ${singular} toevoegen</button>`} $('view').innerHTML=s}
function openForm(type,id){kind=type;editing=id||null;const i=data.items.find(x=>x.id===id);$('formTitle').textContent=i?'Bewerken':'Toevoegen';$('name').value=i?.name||'';$('amount').value=i?amountFor(i,key()):'';$('date').value=i?.date||today();$('repeat').value=i?.repeat||(type==='expenses'?'once':'monthly');$('repeatField').classList.toggle('hidden',!!i);$('dateField').classList.toggle('hidden',type!=='expenses');$('delete').classList.toggle('hidden',!i);$('sheet').classList.remove('hidden');$('name').focus()}
function closeForm(){$('sheet').classList.add('hidden')}
$('form').addEventListener('submit',e=>{e.preventDefault();const name=$('name').value.trim(),amount=Number($('amount').value);if(!name||!Number.isFinite(amount)||amount<0)return;const k=key();if(editing){const i=data.items.find(x=>x.id===editing);if(!i)return; i.name=name;if(i.repeat==='monthly'){i.overrides ||= {};i.overrides[k]=amount}else{i.amount=amount}if(kind==='expenses')i.date=$('date').value}else{data.items.push({id:crypto.randomUUID(),type:kind,name,amount,month:k,repeat:$('repeat').value,date:kind==='expenses'?$('date').value:'',overrides:{}})}save();closeForm();render()});
$('delete').onclick=()=>{const i=data.items.find(x=>x.id===editing);if(!i)return;if(i.repeat==='monthly'){if(confirm('Deze vaste post vanaf deze maand verwijderen?'))i.deletedFrom=key()}else{data.items=data.items.filter(x=>x.id!==editing)}save();closeForm();render()};$('close').onclick=closeForm;$('sheet').addEventListener('click',e=>{if(e.target===$('sheet'))closeForm()});document.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.dataset.tab){tab=btn.dataset.tab;render()}if(btn.dataset.add)openForm(btn.dataset.add);if(btn.dataset.edit){const i=data.items.find(x=>x.id===btn.dataset.edit);if(i)openForm(i.type,i.id)}});$('prev').onclick=()=>{cursor.setMonth(cursor.getMonth()-1);render()};$('next').onclick=()=>{cursor.setMonth(cursor.getMonth()+1);render()};render();
</script></body></html>
